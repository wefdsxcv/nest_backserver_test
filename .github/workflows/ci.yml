came: CI (NestJS Unit Test)

# どのタイミングでこのCIを動かすかを指定します
on:
  push:
    branches: [ "main" ] # mainブランチにプッシュされた時
  pull_request:
    branches: [ "main" ] # mainブランチに向けてプルリクエストが作られた時

jobs:
  test-and-lint:
    # 実行する仮想環境（GitHubが用意してくれるLinuxサーバー）を指定
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubのサーバーに、あなたのソースコードをダウンロード（チェックアウト）します
      - name: Checkout ソースコード取得。ここはただのラベル
        uses: actions/checkout@v4

      # 2. Node.jsの環境をセットアップします
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # package.jsonや環境に合わせたバージョン
          cache: 'npm'       # 2回目以降の実行を速くするためにライブラリをキャッシュ

      # 3. 必要な外部ライブラリ（package.jsonに書かれたもの）をインストールします
      - name: Install dependencies
        run: npm ci

      # 4. コードの書き方に問題がないかチェック（Lint）します
      - name: Run Lint
        run: npm run lint

      # 5. 【メイン】ローカルでやったのと同じ単体テストを実行します！
      - name: Run Unit Tests
        run: npm run test